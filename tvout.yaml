# TvOut FGF - ESPHome build of TvOut_FGF_ESP32.
#
# Same NTSC engine (GPIO25 video, GPIO32 sound, LittleFS images, upload page
# and game on port 80); ESPHome now does WiFi, OTA and Home Assistant.
#
#   first flash (USB):   esphome run tvout.yaml --device COM6
#   then, over the air:  esphome run tvout.yaml --device tvout-fgf.local
#                        (or the IP the router gave it)
#
# Classic ESP32 only (WROOM-32 / PICO-D4). See README.md.

esphome:
  name: tvout-fgf
  friendly_name: TvOut FGF
  # Needs Arduino core 3.x (ledcAttach, Network, IDF 5 I2S timing).
  # 2026-11-14: usa APIs nuevas de ESPHome (network::IP_ADDRESS_BUFFER_SIZE, str_to,
  # require_vfs_dir, request_wifi_scan_results); probado con 2026.10.2 (Arduino como
  # componente de ESP-IDF 5.5).
  min_version: 2026.10.0

esp32:
  board: esp32dev
  flash_size: 4MB
  partitions: partitions.csv     # 2 x 1.375MB OTA slots + 1.19MB LittleFS
  framework:
    type: arduino                # Arduino 3.x: the engine uses LEDC/LittleFS/WebServer
    # 2026-11-14: ESPHome 2026.10 compila Arduino como componente de ESP-IDF 5.5 con el
    # sdkconfig de ESPHome. En el nucleo 1 corren el video (prioridad maxima) y tvapp (modos
    # que nunca duermen, ej. el cubo): igual que el build de Arduino, el watchdog no vigila
    # la tarea IDLE de ese nucleo. Los avisos del driver I2S/ADC antiguo se silencian (el
    # video necesita el modo DAC del I2S antiguo; el driver nuevo no lo tiene).
    sdkconfig_options:
      CONFIG_ESP_TASK_WDT_CHECK_IDLE_TASK_CPU1: n
      CONFIG_I2S_SUPPRESS_DEPRECATE_WARN: y
      CONFIG_ADC_SUPPRESS_DEPRECATE_WARN: y
    advanced:
      sram1_as_iram: true        # sugerido por ESPHome al arrancar: +40 KB de IRAM
      # 2026-11-14: sugerido por ESPHome al arrancar: solo el driver generico de flash (libera IRAM)
      flash_chip: generic
      # 2026-11-14: el chip es rev >= 3.0 (log de arranque); se pone 3.0 y no 3.1 porque no se
      # sabe si es 3.1 exacto, y una imagen con un minimo mayor al chip no arranca tras la OTA
      minimum_chip_revision: "3.0"

external_components:
  - source:
      type: local
      path: components

logger:
  level: WARN   # 2026-11-14: menos textos de log en el firmware (antes INFO)

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:                            # fallback hotspot if the WiFi is unreachable
    ssid: TvOut-FGF Fallback
    password: !secret ap_password
# No ESPHome captive_portal: it wants port 80, which the upload page uses. The
# tvout component serves its own instead: join the hotspot and the phone pops
# up a WiFi setup page (or open http://192.168.4.1/wifi). The SSID/password
# entered there are saved on the board and override the ones above until the
# next firmware with a changed config. OTA also works at 192.168.4.1.

# Boot-loops (e.g. a bad build) drop into a WiFi + OTA only mode, so the board
# can always be reflashed over the air.
safe_mode:

ota:
  - platform: esphome
    password: !secret ota_password
    on_begin:
      - lambda: id(tv).ota_begin();     # 2026-11-14: pausa video/modos/web/sonido durante la OTA
    on_error:
      - lambda: |-
          id(tv).ota_error();
          id(tv).set_mode("dvd");
    # 2026-11-14: si la subida se corta (se cierra la ventana / se cae el Wi-Fi) ESPHome no llama
    # on_error sino OTA_ABORT: sin esto la TV quedaba en negro con todo pausado hasta reiniciar.
    on_state_change:
      - lambda: |-
          if (state == ota::OTA_ABORT) {
            id(tv).ota_error();
            id(tv).set_mode("dvd");
          }

api:
  encryption:
    key: !secret api_key

# 2026-11-14: se quito el bloque mqtt: (nada en HA usaba los topics tvout/*; HA va por la API)
# para achicar el firmware: el espacio OTA es de 1,375 MB (partitions.csv).

tvout:
  id: tv
  web_port: 80                   # upload page + /game; keep ESPHome's web_server off this port
  on_mode:
    - lambda: id(tv_mode).publish_state(x);

select:
  - platform: template
    id: tv_mode
    name: Mode
    icon: mdi:television-classic
    options: [intro, show, message, dvd, butterfly, cube, game, birthday, bano]   # 2026-11-14: bano
    set_action:
      - lambda: id(tv).set_mode(x);

text:
  - platform: template
    name: Message
    icon: mdi:message-text
    mode: text
    max_length: 63
    update_interval: 2s
    lambda: |-
      static std::string last = "\x01";
      std::string s = id(tv).get_message();
      if (s == last) return {};
      last = s;
      return s;
    set_action:
      - lambda: id(tv).show_message(x);

  - platform: template
    name: Image
    icon: mdi:image
    mode: text
    max_length: 24
    update_interval: 2s
    lambda: |-
      static std::string last;
      std::string s = id(tv).get_image();
      if (s == last) return {};
      last = s;
      return s;
    set_action:
      - lambda: id(tv).show_image(x);

switch:
  - platform: template
    name: DVD trail
    icon: mdi:motion
    restore_mode: RESTORE_DEFAULT_ON   # trail on unless HA turned it off, as the Arduino build
    lambda: return id(tv).get_trail();   # polled every loop, so web page changes show up too
    turn_on_action:
      - lambda: id(tv).set_trail(true);
    turn_off_action:
      - lambda: id(tv).set_trail(false);

button:
  # 2026-11-14: antes solo tocaba la melodia por el audio (GPIO32, RCA blanco) y la TV no
  # cambiaba: sin parlante conectado parecia que no hacia nada. Ahora pone la tarjeta de
  # cumpleanos (imagen hb_photo) y la melodia; si ya estaba en cumpleanos, repite la melodia.
  - platform: template
    name: Play birthday
    icon: mdi:cake-variant
    on_press:
      - lambda: |-
          if (id(tv).get_mode() == "birthday") id(tv).play_sound("birthday");
          else id(tv).set_mode("birthday");   // la melodia suena sola al entrar al modo
  - platform: template
    name: Beep
    icon: mdi:volume-high
    on_press:
      - lambda: id(tv).play_sound("beep");
  - platform: template
    name: Sound off
    icon: mdi:volume-off
    on_press:
      - lambda: id(tv).play_sound("off");
  - platform: restart
    name: Restart

sensor:
  - platform: template
    name: Video field rate
    icon: mdi:sine-wave
    unit_of_measurement: Hz
    accuracy_decimals: 2
    entity_category: diagnostic
    update_interval: 60s
    lambda: |-
      // 2026-11-14: field_rate se mide una vez al arrancar (app.cpp); publicarlo solo una vez
      static bool sent = false;
      float r = id(tv).get_field_rate();
      if (r <= 0 || sent) return {};
      sent = true;
      return r;
  - platform: template
    name: Image count
    icon: mdi:image-multiple
    accuracy_decimals: 0
    update_interval: 5s
    lambda: |-
      // 2026-11-14: publica solo si cambia (como 'Images'); el API reenvia el ultimo estado al reconectar
      static int last = -1;
      int n = id(tv).get_image_count();
      if (n == last) return {};
      last = n;
      return n;
  - platform: wifi_signal
    name: WiFi signal
    update_interval: 60s
  - platform: uptime
    name: Uptime

text_sensor:
  - platform: template
    name: Images
    icon: mdi:folder-image
    update_interval: 5s            # cheap: re-lists only after an upload/delete
    lambda: |-
      static bool sent = false;    // publish once even when the list is empty
      static std::string last;
      std::string s = id(tv).get_image_list();
      if (sent && s == last) return {};
      sent = true;
      last = s;
      return s;
  - platform: wifi_info
    ip_address:
      name: IP address
